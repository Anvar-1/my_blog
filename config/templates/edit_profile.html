{% extends 'base.html' %}
{% load i18n %}

{% block content %}
<!-- mt-5 tepadan, mb-5 esa pastdan (footer bilan orada) masofa tashlaydi -->
<div class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <form method="POST" enctype="multipart/form-data" class="p-4 shadow rounded bg-white">
                {% csrf_token %}
                <h2 class="mb-4 text-center">{% trans "Profilni tahrirlash" %}</h2>
                
                <div class="mb-3">
                    <label class="form-label">{% trans "Profil rasmi (Avatar)" %}</label>
                    <div class="mb-2">
                        {% if user.profile.avatar %}
                            <img src="{{ user.profile.avatar.url }}" class="rounded-circle" width="100" height="100">
                        {% endif %}
                    </div>
                    {{ p_form.avatar }}
                </div>

                <div class="mb-3">
                    <label class="form-label">{% trans "Muqova rasmi (Cover)" %}</label>
                    {{ p_form.cover_image }}
                </div>

                <div class="mb-3">
                    <label class="form-label">{% trans "To'liq ismingiz" %}</label>
                    {{ p_form.full_name }}
                </div>

                <div class="mb-3">
                    <label class="form-label">{% trans "Bio (O'zingiz haqingizda)" %}</label>
                    {{ p_form.bio }}
                </div>

                <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                    <a href="{% url 'profile' %}" class="btn btn-secondary me-md-2">{% trans "Bekor qilish" %}</a>
                    <button type="submit" class="btn btn-primary">{% trans "Saqlash" %}</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
