{% extends 'base.html' %}
{% load i18n %}

{% block content %}
<div class="alert alert-danger col-md-6 mx-auto text-center shadow rounded-4">
    <h4 class="fw-bold">{% translate "Haqiqatdan ham ushbu postni o'chirmoqchimisiz?" %}</h4>
    <hr>
    <p class="mb-4">{% translate "Post nomi:" %} <span class="fw-bold">"{{ post.title }}"</span></p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger px-4">
            <i class="bi bi-trash-fill me-1"></i> {% translate "Ha, o'chirilsin" %}
        </button>
        <a href="{% url 'post_detail' post.pk %}" class="btn btn-secondary px-4">
            {% translate "Yo'q, qaytish" %}
        </a>
    </form>
</div>
{% endblock %}
