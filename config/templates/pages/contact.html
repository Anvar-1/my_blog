{% extends 'base.html' %}
{% load i18n %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <h2 class="fw-bold mb-4">{% translate "Biz bilan bog'laning" %}</h2>

            <div class="card border-0 shadow-sm p-4 rounded-4">
                <form method="POST" action="{% url 'contact' %}">
                    {% csrf_token %}

                    <div class="mb-3 text-start">
                        <label class="form-label fw-bold small text-secondary">{% translate "Ismingiz" %}</label>
                        <input type="text" name="name" class="form-control rounded-3 shadow-none" placeholder="{% translate 'Ismingizni yozing...' %}" required>
                    </div>

                    <div class="mb-4 text-start">
                        <label class="form-label fw-bold small text-secondary">{% translate "Xabaringiz" %}</label>
                        <textarea name="message" class="form-control rounded-3 shadow-none" rows="4" placeholder="{% translate 'Fikringizni yoki savolingizni yozing...' %}" required></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 rounded-pill py-2 fw-bold shadow-sm">
                        {% translate "Xabarni yuborish" %} <i class="bi bi-send-fill ms-1"></i>
                    </button>
                </form>

                <div class="mt-4 pt-4 border-top">
                    <p class="text-muted small mb-3">{% translate "Yoki ijtimoiy tarmoqlar orqali bog'laning:" %}</p>
                    <div class="d-flex justify-content-center gap-2 flex-wrap">
                        <a href="https://t.me/ishdastur" target="_blank" class="btn btn-outline-primary btn-sm rounded-pill px-3">
                            <i class="bi bi-telegram me-1"></i> Telegram
                        </a>

                        <a href="https://instagram.com/anvar" target="_blank" class="btn btn-outline-danger btn-sm rounded-pill px-3">
                            <i class="bi bi-instagram me-1"></i> Instagram
                        </a>

                        <a href="mailto:anvar@example.com" class="btn btn-outline-secondary btn-sm rounded-pill px-3">
                            <i class="bi bi-envelope-at-fill me-1"></i> Email
                        </a>
                    </div>
                </div>
            </div>

            <div class="mt-4">
                <a href="{% url 'home' %}" class="text-decoration-none text-muted small">
                    <i class="bi bi-arrow-left me-1"></i> {% translate "Asosiy sahifaga qaytish" %}
                </a>
            </div>
        </div>
    </div>
</div>

<style>
    .form-control:focus {
        border-color: #667eea;
        box-shadow: 0 0 0 0.25rem rgba(102, 126, 234, 0.1);
    }

    .btn-primary {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border: none;
        transition: all 0.3s ease;
    }

    .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        opacity: 0.9;
    }

    .btn-sm {
        transition: all 0.2s ease;
    }
    .btn-sm:hover {
        transform: scale(1.05);
    }
</style>
{% endblock %}
