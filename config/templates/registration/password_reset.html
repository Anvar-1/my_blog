{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card p-4 shadow-sm">
            <h3 class="fw-bold">Parolni tiklash</h3>
            <p class="text-muted small">Emailingizni kiriting, biz sizga havola yuboramiz.</p>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary w-100 rounded-pill">Havola yuborish</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
